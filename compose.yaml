services:
  ha-screenshot:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Keep generated images on the named Docker volume, regardless of the
      # host-friendly OUTPUT_DIRECTORY value in .env.
      OUTPUT_DIRECTORY: /data
    volumes:
      - screenshot-data:/data
    # Chromium benefits from a larger shared-memory area.
    shm_size: "256mb"

volumes:
  screenshot-data:
