# Copy this template to esphome-trmnl-diy-kit.yaml before customizing it.
substitutions:
  device_name: trmnl-ha-display
  friendly_name: TRMNL Home Assistant Display
  screenshot_server: "http://192.168.1.50:3000"
  first_task_id: overview
  second_task_id: energy

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  on_boot:
    priority: 600
    then:
      - output.turn_on: battery_measurement_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Decoding an 800 x 480 PNG requires PSRAM.
psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Setup"
    password: !secret fallback_hotspot_password

captive_portal:

http_request:
  # The screenshot service is plain HTTP on the trusted local network.
  verify_ssl: false
  timeout: 15s
  watchdog_timeout: 20s

image:
  - platform: online_image
    id: first_page_image
    url: "${screenshot_server}/screenshots/${first_task_id}"
    format: PNG
    type: BINARY
    buffer_size: 30000
    update_interval: 5min
    on_download_finished:
      then:
        # Do not refresh the panel after an HTTP 304 cache hit.
        - if:
            condition:
              lambda: return !cached && id(page_index) == 0;
            then:
              - component.update: epaper_display

  - platform: online_image
    id: second_page_image
    url: "${screenshot_server}/screenshots/${second_task_id}"
    format: PNG
    type: BINARY
    buffer_size: 30000
    update_interval: 5min
    on_download_finished:
      then:
        - if:
            condition:
              lambda: return !cached && id(page_index) == 1;
            then:
              - component.update: epaper_display

font:
  - file: "gfonts://Inter@700"
    id: battery_font
    size: 12

globals:
  - id: page_index
    type: int
    restore_value: false
    initial_value: "0"

output:
  # Enables the kit's battery-voltage divider.
  - platform: gpio
    pin: GPIO6
    id: battery_measurement_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "${friendly_name} Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    name: "${friendly_name} Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(battery_voltage).state;
    filters:
      # Approximate Li-ion discharge curve from Seeed's example.
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.27 -> 0.0
            - 3.30 -> 5.0
            - 3.41 -> 10.0
            - 3.49 -> 20.0
            - 3.58 -> 30.0
            - 3.68 -> 40.0
            - 3.75 -> 50.0
            - 3.80 -> 60.0
            - 3.85 -> 70.0
            - 3.91 -> 80.0
            - 3.96 -> 90.0
            - 4.15 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

binary_sensor:
  - platform: gpio
    id: key1
    name: "${friendly_name} Next Page"
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - lambda: id(page_index) = (id(page_index) + 1) % 2;
        - component.update: epaper_display

  - platform: gpio
    id: key2
    name: "${friendly_name} Previous Page"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - lambda: id(page_index) = (id(page_index) - 1 + 2) % 2;
        - component.update: epaper_display

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    update_interval: never
    lambda: |-
      if (id(page_index) == 0) {
        it.image(0, 0, id(first_page_image));
      } else {
        it.image(0, 0, id(second_page_image));
      }

      // An opaque badge keeps the battery reading legible over the image.
      const int badge_x = 730;
      const int badge_w = 70;
      it.filled_rectangle(badge_x, 0, badge_w, 18, COLOR_OFF);

      if (!isnan(id(battery_level).state)) {
        int pct = (int) roundf(id(battery_level).state);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        const int fill_w = pct * 16 / 100;

        it.rectangle(733, 4, 20, 10, COLOR_ON);
        it.filled_rectangle(753, 7, 2, 4, COLOR_ON);
        if (fill_w > 0) {
          it.filled_rectangle(735, 6, fill_w, 6, COLOR_ON);
        }
        it.printf(798, 2, id(battery_font), COLOR_ON,
                  TextAlign::TOP_RIGHT, "%d%%", pct);
      }
