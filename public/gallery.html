<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/app.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="/gallery.js" defer></script>
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar bg-dark navbar-dark shadow-sm"><div class="container-fluid px-lg-4"><span class="navbar-brand fw-semibold">HA Screenshot</span><a class="btn btn-outline-light btn-sm ms-auto" href="/admin/">Manage</a></div></nav>
    <main class="container py-5">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><h1 class="display-6 fw-semibold mb-1">Dashboard images</h1><p class="text-body-secondary mb-0">Stable scheduled feeds and their source captures.</p></div><div class="small text-body-secondary"><span id="summary" role="status">Loading…</span><br><span id="updated"></span></div></div>
      <div id="error" class="alert alert-danger" hidden></div>
      <section aria-labelledby="images-heading" class="mb-5"><div class="d-flex align-items-baseline gap-3 mb-3"><h2 id="images-heading" class="h4 mb-0">Scheduled image URLs</h2><span id="timezone" class="small text-body-secondary"></span></div><div id="images" class="row g-4"></div><div id="images-empty" class="border rounded bg-white text-center text-body-secondary p-5" hidden>No scheduled image URLs are configured.</div></section>
      <section aria-labelledby="tasks-heading"><h2 id="tasks-heading" class="h4 mb-3">Direct capture tasks</h2><div id="tasks" class="row g-4"></div></section>
    </main>
  </body>
</html>
